name: tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Default to least-privilege. Per-job overrides set what each job needs.
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Matches pyproject.toml: python = ">=3.10". 3.10 is the floor;
        # 3.14 is the latest stable. Drop a version here when EOL'd.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,eval,api,pdf-render]
      - name: Lint
        run: |
          pip install ruff
          ruff check src/ tests/ examples/
      - name: Type check
        run: |
          pip install mypy
          mypy src/idp/
      - name: Test
        run: |
          pip install pytest-cov
          pytest -v --cov=idp --cov-report=term-missing --cov-fail-under=90
      - name: Eval smoke
        run: |
          idp eval --dataset src/idp/eval/datasets/invoices \
                   --strategy mock --output eval-results.json
          test -f eval-results.json
