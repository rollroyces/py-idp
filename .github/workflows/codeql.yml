name: codeql

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Weekly scan at 06:00 UTC on Mondays. Catches anything new
    # since the last scan.
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include language: [python]
        # JavaScript / TypeScript disabled — this is a Python-only project
        # and CodeQL JS analysis takes ~2 min for nothing.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # CodeQL Action v3 is deprecated and will be removed in December
      # 2026. v4 has the same surface but adds Python 3.13 support,
      # better incremental analysis, and a smaller image.
      # https://github.blog/changelog/2025-10-28-upcoming-deprecation-of-codeql-action-v3/
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Use the default query packs (security + quality). The
          # security-extended pack adds more queries but is opt-in.
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"